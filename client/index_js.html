<script>

  "use strict";


  /**
   * Inicializa os sistema ao carregar a página index.html
   */
  document.addEventListener( 'DOMContentLoaded', () => {

    document.getElementById( "conteudo" ).innerHTML = "Client OK";

  }); // Fim do document.addEventListener





  function chamarControllerPost( nomeRecurso ) {

    // Controller URL
    const url = "https://script.google.com/macros/s/AKfycbxgbJq0XEdW71LY9hF3GuatIz6TqRVE4NTm-fn0D0SWm9DcP6ugee9dXyf8ZnpMuSit/exec";
    
    
    // Dados que serão enviados para o serviço
    const body = {
      nomeRecurso: nomeRecurso
    };
  
    // Configuração da requisição REST POST
    let options = {
      method: "post",
      body: JSON.stringify(body)
    };    


    // Seleciona a div resposta apropriada 
    let idDiv = selectDiv( nomeRecurso );


    // Chama o método POST do controller
    fetch( url, options )

        .then((data) => {
            if (data.ok) {
                return data.json();
                //return data;
            }
            console.log( data.statusText );
            throw data.statusText;
        })

        .then((data) => {
            document.getElementById(idDiv).innerHTML = "Controller POST Ok - " + data.nomeRecurso;
            console.log( "DATA BEGIN" )
            console.log( data );   
            console.log( "DATA END" )            
        })

        .catch((error) => {       
            document.getElementById(idDiv).innerHTML = "Controller POST Error - " + error;
            console.error(error);
        });

  } // Fim da função chamarControllerPost




  function chamarControllerGet( nomeRecurso ) {

    // Controller URL
    const url = "https://script.google.com/macros/s/AKfycbxgbJq0XEdW71LY9hF3GuatIz6TqRVE4NTm-fn0D0SWm9DcP6ugee9dXyf8ZnpMuSit/exec";
    
    
    // Dados que serão enviados para o serviço
    const params = new URLSearchParams();
    params.append("nomeRecurso", nomeRecurso);   
    
    
    // Seleciona a div resposta apropriada 
    let idDiv = selectDiv( nomeRecurso );


    // Chama o método GET do controller
    fetch( url + `?${params}` )
    
        .then((data) => {
          if (data.ok) {
            return data.json();
            //return data;
          }
          console.log( data.statusText );
          throw data.statusText;              
        })

        .then((data) => {
          document.getElementById(idDiv).innerHTML = "Controller GET Ok - " + data.nomeRecurso;
          console.log( "DATA BEGIN" )
          console.log( data );   
          console.log( "DATA END" )
        })

        .catch((error) => {       
          document.getElementById(idDiv).innerHTML = "Controller GET Error - " + error;
          console.error(error);
        });

  } // Fim da função chamarControllerGet 



  function selectDiv( nomeRecurso ) {

    // Seleciona a div resposta apropriada 
    let idDiv;
    switch( nomeRecurso ) {
      case "AUTHENTICATOR": idDiv = "div_controller_get_authenticator";
                            break;
      case "ENTITIES":      idDiv = "div_controller_get_entities";
                            break;                            
      case "QUEUE":         idDiv = "div_controller_get_queue";
                            break;  
      default:  console.log( "Client chamarControllerGet - PARÂMETRO INVÁLIDO" );                          
                return false;
    }

    return idDiv;

  }



</script>
