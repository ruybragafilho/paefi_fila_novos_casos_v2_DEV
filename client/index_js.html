<script>

  "use strict";


  const url = "https://script.google.com/macros/s/AKfycbxgbJq0XEdW71LY9hF3GuatIz6TqRVE4NTm-fn0D0SWm9DcP6ugee9dXyf8ZnpMuSit/exec";


  /**
   * Inicializa os sistema ao carregar a página index.html
   */
  document.addEventListener( 'DOMContentLoaded', () => {

    document.getElementById( "conteudo" ).innerHTML = "Client OK";

  }); // Fim do document.addEventListener



  /**
   * Utiliza a função HTTP GET para se comunicar com o CONTROLLER
   */
  function chamarControllerGet( nomeRecurso ) {
    
    // Dados que serão enviados para o serviço
    const params = new URLSearchParams();
    params.append("nomeRecurso", nomeRecurso+"_GET");   
    
    
    // Seleciona a div resposta apropriada 
    let idDiv = selectDiv( nomeRecurso );


    // Chama o método GET do controller
    fetch( url + `?${params}` )
    
        .then((data) => {
          if (data.ok) {
            return data.json();
            //return data;
          }
          console.log( data.statusText );
          throw data.statusText;              
        })

        .then((data) => {
          document.getElementById(idDiv).innerHTML = "Client GET Ok - " + data.mensagem;
          console.log( "DATA BEGIN" )
          console.log( data );   
          console.log( "DATA END" )
        })

        .catch((error) => {       
          document.getElementById(idDiv).innerHTML = "Client GET Error - " + error;
          console.error(error);
        });

  } // Fim da função chamarControllerGet 



  /**
   * Utiliza a função HTTP POST para se comunicar com o CONTROLLER
   */
  function chamarControllerPost( nomeRecurso ) {
    
    // Dados que serão enviados para o serviço
    const body = {
      nomeRecurso: nomeRecurso+"_POST"
    };
  
    // Configuração da requisição REST POST
    let options = {
      method: "post",
      body: JSON.stringify(body)
    };    


    // Seleciona a div resposta apropriada 
    let idDiv = selectDiv( nomeRecurso );


    // Chama o método POST do controller
    fetch( url, options )

        .then((data) => {
            if (data.ok) {
                return data.json();
                //return data;
            }
            console.log( data.statusText );
            throw data.statusText;
        })

        .then((data) => {
            document.getElementById(idDiv).innerHTML = "Client POST Ok - " + data.mensagem;
            console.log( "DATA BEGIN" )
            console.log( data );   
            console.log( "DATA END" )            
        })

        .catch((error) => {       
            document.getElementById(idDiv).innerHTML = "Client POST Error - " + error;
            console.error(error);
        });

  } // Fim da função chamarControllerPost




  function chamarAuthenticatorGET() {
    chamarControllerGet('AUTHENTICATOR');
  }

  function chamarAuthenticatorPOST() {
    chamarControllerPost('AUTHENTICATOR');
  }  


  function chamarEntitiesGET() {
    chamarControllerGet('ENTITIES');
  }

  function chamarEntitiesPOST() {
    chamarControllerPost('ENTITIES');
  }    


  function chamarQueueGET() {
    chamarControllerGet('QUEUE');
  }

  function chamarQueuePOST() {
    chamarControllerPost('QUEUE');
  }  




  function selectDiv( nomeRecurso ) {

    // Seleciona a div resposta apropriada 
    let idDiv;
    switch( nomeRecurso ) {
      case "AUTHENTICATOR": idDiv = "div_authenticator";
                            break;
      case "ENTITIES":      idDiv = "div_entities";
                            break;                            
      case "QUEUE":         idDiv = "div_queue";
                            break;  
      default:  console.log( "Client chamarControllerGet - PARÂMETRO INVÁLIDO" );                          
                return false;
    }

    return idDiv;

  }



</script>
