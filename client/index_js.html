<script>

  "use strict";


  /**
   * Inicializa os sistema ao carregar a página index.html
   */
  document.addEventListener( 'DOMContentLoaded', () => {

    document.getElementById( "conteudo" ).innerHTML = "Client OK";

  }); // Fim do document.addEventListener





  function chamarControllerPost() {

    // Controller URL
    const url = "https://script.google.com/macros/s/AKfycbxgbJq0XEdW71LY9hF3GuatIz6TqRVE4NTm-fn0D0SWm9DcP6ugee9dXyf8ZnpMuSit/exec";
    
    
    // Dados que serão enviados para o serviço
    const body = {
      nomeRecurso: "Authenticator"
      //nomeRecurso: "Entities"
      //nomeRecurso: "Queue"
    };
  
    // Configuração da requisição REST POST
    let options = {
      method: "post",
      body: JSON.stringify(body)
    };    


    fetch( url, options )

        .then((data) => {
            if (data.ok) {
                return data.json();
                //return data;
            }
            console.log( data.statusText );
            throw data.statusText;
        })

        .then((data) => {
            document.getElementById("div_controller_post").innerHTML = "Controller Ok";
            console.log( "DATA BEGIN" )
            console.log( data );   
            console.log( "DATA END" )            
        })

        .catch((error) => {       
            document.getElementById("div_controller_post").innerHTML = "Controller Error - " + error;
            console.error(error);
        });

  } // Fim da função chamarControllerPost




  function chamarControllerGet() {

    // Controller URL
    const url = "https://script.google.com/macros/s/AKfycbxgbJq0XEdW71LY9hF3GuatIz6TqRVE4NTm-fn0D0SWm9DcP6ugee9dXyf8ZnpMuSit/exec";
    
    
    // Dados que serão enviados para o serviço
    const params = new URLSearchParams();
    params.append("nomeRecurso", "Authenticator");    
    //params.append("nomeRecurso", "Entities");    
    //params.append("nomeRecurso", "Queue");    

    // Chamada get no controller
    fetch( url + `?${params}` )
    
        .then((data) => {
          if (data.ok) {
            return data.json();
            //return data;
          }
          console.log( data.statusText );
          throw data.statusText;              
        })

        .then((data) => {
          document.getElementById("div_controller_get").innerHTML = "Controller Ok";
          console.log( "DATA BEGIN" )
          console.log( data );   
          console.log( "DATA END" )
        })

        .catch((error) => {       
          document.getElementById("div_controller_get").innerHTML = "Controller Error - " + error;
          console.error(error);
        });

  } // Fim da função chamarControllerGet 


</script>
